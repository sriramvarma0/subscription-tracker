{% extends 'base.html' %}

{% block title %}Sign In - Subscription Tracker{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div style="display: flex; justify-content: center; margin-bottom: 1rem; color: #6366f1;">
      <i data-lucide="shield-check" style="width: 48px; height: 48px;"></i>
    </div>
    <h1>Subscription Tracker</h1>
    <p>Enter your email address to continue to your subscriptions.</p>
    
    <form action="{{ url_for('auth.login') }}" method="POST" id="loginForm">
      <div class="form-group" style="text-align: left;">
        <label for="email">Email Address <span class="required">*</span></label>
        <div style="position: relative;">
          <input 
            type="email" 
            name="email" 
            id="emailInput" 
            class="form-control" 
            placeholder="name@example.com" 
            value="{{ email or '' }}"
            required 
            autofocus
            style="padding-left: 2.5rem;"
          />
          <i data-lucide="mail" style="position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); width: 18px; color: var(--text-muted);"></i>
        </div>
      </div>
      
      <button type="submit" class="btn btn-primary" id="loginSubmitBtn" style="width: 100%; justify-content: center; margin-top: 1.25rem;">
        <span>Continue</span>
        <i data-lucide="arrow-right"></i>
      </button>
    </form>
  </div>
</div>
{% endblock %}
